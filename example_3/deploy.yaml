name: "Minimal Firmware Relay Test"
description: "Test Sonoff relays with minimal test firmware using serial communication and optional oscilloscope measurements"

# Test configuration
test_config:
  serial_port: null                    # Auto-detect FTDI devices
  baudrate: 115200                     # Fixed baudrate for minimal firmware
  test_cycles: 5                       # Number of ON/OFF cycles
  delay_between_cycles: 1.0           # Delay between cycles in seconds
  burn_in_cycles: 100                 # Number of burn-in cycles
  burn_in_interval: 500               # Burn-in interval in milliseconds
  burn_in_timeout_minutes: 10         # Burn-in timeout
  enable_button_test: true            # Enable button testing
  button_test_duration: 10            # Button test duration in seconds
  enable_timing_test: true            # Enable microsecond timing tests
  enable_oscilloscope_test: false     # Enable oscilloscope measurements
  oscilloscope_ip: null               # Auto-detect or specify IP
  oscilloscope_port: 5555             # SCPI port
  oscilloscope_timebase: 0.001        # Timebase in seconds/div
  waveform_output_dir: "waveforms"    # Waveform output directory

# Hardware requirements
requirements:
  - "Sonoff relay with minimal test firmware"
  - "FTDI USB-to-Serial adapter (VID 0403, PID 6001)"
  - "Serial connection to device"
  - "Optional: Rigol DS1054 oscilloscope for waveform analysis"

# Expected outputs
outputs:
  - name: "Device Status"
    description: "Comprehensive device status in JSON format"
    file: "test_outputs/device_status.json"
    
  - name: "Device Metrics"
    description: "Key device metrics in CSV format"
    file: "test_outputs/device_metrics.csv"
    
  - name: "Timing Measurements"
    description: "Microsecond-precision relay timing data"
    file: "test_outputs/timing_measurements.csv"
    
  - name: "Relay Waveforms"
    description: "Oscilloscope waveform data (if enabled)"
    files:
      - "waveforms/relay_rising.csv"
      - "waveforms/relay_falling.csv"

# Test flow steps
test_steps:
  1: "Detect and connect to minimal firmware device"
  2: "Check firmware version and capabilities"
  3: "Run device self-test"
  4: "Test basic relay control functionality"
  5: "Perform microsecond-precision timing measurements"
  6: "Test button functionality (user interaction)"
  7: "Execute automated burn-in testing"
  8: "Generate comprehensive status report"
  9: "Capture relay response waveforms (optional)"

# Success criteria
success_criteria:
  - "Device detected and firmware validated"
  - "All relay control commands successful"
  - "Burn-in test completes without errors"
  - "Timing measurements within expected ranges"
  - "Device status reports correctly"
  - "All test outputs generated successfully"

# Failure handling
failure_modes:
  - "No FTDI devices found: Check USB connections"
  - "Firmware not detected: Verify minimal firmware is flashed"
  - "Relay control failed: Check hardware connections"
  - "Burn-in timeout: Check device operation"
  - "Button test failed: Verify button hardware"
  - "Timing measurement failed: Check device responsiveness"